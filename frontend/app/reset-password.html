<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nouveau mot de passe — Kimia</title>
  <meta name="theme-color" content="#212521">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">K</div>
        <h1 class="login-title">Nouveau mot de passe</h1>
        <p class="login-subtitle">10 caractères minimum, avec une lettre et un chiffre</p>
      </div>
      <form class="form" id="f" novalidate>
        <div class="field">
          <label for="p1">Nouveau mot de passe</label>
          <input id="p1" type="password" autocomplete="new-password" required autofocus>
        </div>
        <div class="field">
          <label for="p2">Confirmer</label>
          <input id="p2" type="password" autocomplete="new-password" required>
        </div>
        <div class="login-error hidden" id="msg" role="alert"></div>
        <button type="submit" class="btn btn-primary" id="btn" style="width:100%">Enregistrer</button>
      </form>
    </div>
  </main>
  <script>
    // Le jeton est lu une fois puis retiré de la barre d'adresse (historique, copier-coller).
    const token = new URLSearchParams(location.search).get("token");
    history.replaceState(null, "", location.pathname);
    const msg = document.getElementById("msg");
    const show = (t) => { msg.textContent = t; msg.classList.remove("hidden"); };
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const [p1, p2] = [document.getElementById("p1").value, document.getElementById("p2").value];
      if (!token) return show("Lien invalide.");
      if (p1 !== p2) return show("Les mots de passe ne correspondent pas.");
      const btn = document.getElementById("btn");
      btn.disabled = true;
      try {
        const r = await fetch("/api/auth/reset-password", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({token, new_password: p1}),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) {
          localStorage.removeItem("kimia_token"); localStorage.removeItem("kimia_user");
          show("Mot de passe mis à jour. Redirection…");
          setTimeout(() => location.replace("login.html"), 1500);
          return;
        }
        show(typeof d.detail === "string" ? d.detail
          : (d.detail || []).map((x) => x.msg).join(" ; ") || "Erreur");
      } catch { show("Serveur injoignable."); }
      btn.disabled = false;
    });
  </script>
</body>
</html>
